<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Hyderabad Booking Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1" th:text="${appName}">Admin Panel</span>
        <span class="text-white">Role: ADMIN</span>
    </nav>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h2>Welcome to Hyderabad Booking Marketplace Admin Panel</h2>
                <p class="text-muted">Manage partners, services, bookings, payouts, and commissions.</p>
                <hr>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Total Users</h5>
                        <p class="card-text fs-3 fw-bold" th:text="${totalUsers}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Pending Partners</h5>
                        <p class="card-text fs-3 fw-bold">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Active Bookings</h5>
                        <p class="card-text fs-3 fw-bold">0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
